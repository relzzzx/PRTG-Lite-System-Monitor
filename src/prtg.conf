# ==============================================================================
# PRTG-Lite OS Monitor - Konfigurasi bersama
# Dibaca oleh sensor_agent.sh (Bash) DAN dashboard_server.py (Python), sehingga
# ambang batas di agen dan di dashboard selalu sama. Format: KUNCI=NILAI.
# Setelah diubah, restart agen dan server.
# ==============================================================================

# Siklus pembacaan sensor (detik) - proposal: setiap 5 detik
INTERVAL=5

# Ambang batas (%): >= WARN -> WARNING, >= CRIT -> CRITICAL
CPU_WARN=80
CPU_CRIT=95
MEM_WARN=80
MEM_CRIT=90
SWAP_WARN=50
SWAP_CRIT=80
DISK_WARN=80
DISK_CRIT=90

# Auto-Action (hanya proses user-space, tidak pernah root/kernel/sistem)
RENICE_VALUE=10        # nilai nice yang dipasang saat CPU >= CPU_WARN
MIN_ACTION_CPU=20      # proses harus memakai >= nilai ini (%) agar ditertibkan
MIN_ACTION_UID=1000    # hanya UID >= nilai ini yang boleh ditertibkan
AUTO_KILL=0            # 1 = kirim SIGTERM bila CPU >= CPU_CRIT & proses sudah di-renice

# Log
MAX_LOG_LINES=5000     # rotasi: simpan N baris terbaru (mitigasi Risiko 2)
LOCK_FILE=/tmp/sysmon.lock
LOG_GROUP=             # opsional: nama grup untuk chown :grup pada berkas log
